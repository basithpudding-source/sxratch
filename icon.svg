<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sxratch">
  <!-- Full-bleed background keeps the maskable safe-zone covered when cropped -->
  <rect width="512" height="512" rx="104" fill="#0a0b10"/>
  <!-- Platter -->
  <circle cx="256" cy="256" r="150" fill="#15171f" stroke="#23262f" stroke-width="6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#37e6c8" stroke-width="3" opacity="0.5"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="#2a2d38" stroke-width="2"/>
  <circle cx="256" cy="256" r="86" fill="none" stroke="#2a2d38" stroke-width="2"/>
  <!-- Label + spindle -->
  <circle cx="256" cy="256" r="50" fill="#ff5d8f"/>
  <circle cx="256" cy="256" r="11" fill="#0a0b10"/>
  <!-- Tonearm -->
  <line x1="372" y1="150" x2="292" y2="232" stroke="#cfd3dc" stroke-width="11" stroke-linecap="round"/>
  <circle cx="372" cy="150" r="15" fill="#cfd3dc"/>
</svg>
